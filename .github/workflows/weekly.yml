name: weekly

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      watch: ${{ steps.watch.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q
      - run: aasm check
      - name: Fetch Eurostat adoption data
        run: aasm fetch-eurostat
      - name: Watch the public pages of the work items
        id: watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: aasm watch-standards
        continue-on-error: true
      - run: aasm derive
      - run: aasm report
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/quality.md
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly update $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - run: aasm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  watch-status:
    needs: update
    if: ${{ needs.update.outputs.watch == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "watch-standards reported failed pages; see the needs-review issue, or the update job log if no issue exists" && exit 1

  publish:
    needs: update
    if: ${{ vars.PUBLISH_PAGES == 'true' }}   # set the repo variable PUBLISH_PAGES=true when the repo goes public
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
